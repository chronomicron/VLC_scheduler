; =============================================================================
; settings.ini — VLC Scheduler configuration
;
; What this file does:
;   Defines the media source paths and time-based schedule blocks that
;   VLC_scheduler.py / gui.py read at startup and reload on edits.
;
; How it's used:
;   Loaded automatically by VLC_scheduler.py via configparser at program
;   start. No manual invocation needed — just edit this file and restart
;   the app (or use the web/GUI edit controls, which rewrite this file for
;   you) for changes to take effect.
;
; Platform:
;   Linux (Raspberry Pi / Raspbian). All paths below use standard Linux
;   forward-slash paths. This file previously targeted Windows during early
;   development — that's no longer the case as of this revision.
;
; Schedule block types (type= field):
;   local            -> plays a random file from a local folder (path=)
;   stream           -> plays a direct TV stream URL (url=)              [not yet implemented in code]
;   youtube_playlist -> plays videos from a YouTube playlist (url=)      [not yet implemented in code]
;
;   NOTE: as of this revision, only "local" is actually read by the running
;   code. The "stream" and "youtube_playlist" examples below are placeholders
;   showing the intended schema for upcoming work — they are commented out
;   so they don't affect current behavior.
; =============================================================================

[Fallback]
; Always-available local folder. Intended to be played whenever nothing is
; scheduled for the current time, or a scheduled source fails.
; NOTE: fallback behavior is not yet implemented in code (Phase 0 work) —
; this section is a placeholder for that upcoming change.
type=local
path=/home/pi/media/fallback

